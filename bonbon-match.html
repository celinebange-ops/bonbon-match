<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bonbon-Match</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap');

  :root {
    --bg-1: #FFE8F3;
    --bg-2: #E4F3FF;
    --board: #7C5CFF;
    --board-dark: #6446E8;
    --cell: rgba(255,255,255,0.35);
    --ink: #3A2E5C;
    --ink-soft: #6E5F94;
    --white: #FFFFFF;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: radial-gradient(circle at 15% 20%, var(--bg-1), transparent 55%),
                radial-gradient(circle at 85% 15%, var(--bg-2), transparent 50%),
                radial-gradient(circle at 50% 90%, #E9FFE0, transparent 55%),
                #FFF9F5;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 50px;
    overflow-x: hidden;
    position: relative;
    user-select: none;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(2px);
    opacity: 0.45;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .blob:nth-child(1){ width:110px; height:110px; background:#FFC9B0; top:8%; left:5%; }
  .blob:nth-child(2){ width:80px; height:80px; background:#A9E4F5; top:72%; left:4%; animation-delay:2s;}
  .blob:nth-child(3){ width:100px; height:100px; background:#D4F5A9; top:14%; right:5%; animation-delay:1s;}
  .blob:nth-child(4){ width:70px; height:70px; background:#FFB7E0; top:76%; right:7%; animation-delay:3s;}
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  header { text-align: center; z-index: 1; margin-bottom: 14px; }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: clamp(2rem, 7vw, 3rem);
    margin: 0;
    background: linear-gradient(135deg, #FF6FA5, #7C5CFF 55%, #38C6C0);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle { margin: 4px 0 0; color: var(--ink-soft); font-weight: 600; font-size: 0.92rem; }

  .hud { display: flex; gap: 12px; margin: 16px 0 14px; z-index: 1; }
  .stat {
    background: var(--white);
    border-radius: 16px;
    padding: 8px 20px;
    text-align: center;
    box-shadow: 0 4px 0 rgba(124,92,255,0.15);
    min-width: 84px;
  }
  .stat .label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); }
  .stat .value { font-family: 'Fredoka', sans-serif; font-size: 1.35rem; font-weight: 600; color: var(--board); }

  #newgame {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    border: none;
    border-radius: 16px;
    padding: 9px 20px;
    background: linear-gradient(135deg, #FF6FA5, #FF9ECF);
    color: white;
    box-shadow: 0 4px 0 #C7137E;
    cursor: pointer;
  }
  #newgame:active { transform: translateY(3px); box-shadow: 0 1px 0 #C7137E; }

  .board-wrap { position: relative; z-index: 1; }

  #board {
    position: relative;
    background: linear-gradient(160deg, var(--board), var(--board-dark));
    border-radius: 20px;
    padding: 8px;
    width: min(90vw, 384px);
    height: min(90vw, 384px);
    box-shadow: 0 10px 0 var(--board-dark), 0 16px 30px rgba(124,92,255,0.35);
    touch-action: none;
  }

  .grid-bg {
    position: absolute;
    inset: 8px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: 5px;
  }
  .cell-bg { background: var(--cell); border-radius: 10px; }

  .tiles-layer { position: absolute; inset: 8px; }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-size: 1.5rem;
    cursor: pointer;
    transition: top 0.16s ease, left 0.16s ease, transform 0.12s ease;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.08);
  }
  .tile.spawn { animation: dropIn 0.18s ease; }
  .tile.selected { transform: scale(1.12); box-shadow: 0 0 0 3px white, 0 0 12px rgba(255,255,255,0.8); z-index: 3; }
  .tile.clearing { animation: pop-out 0.22s ease forwards; z-index: 2; }

  @keyframes dropIn { from { transform: translateY(-16px); opacity:0.4; } to { transform: translateY(0); opacity:1; } }
  @keyframes pop-out { 0%{transform:scale(1);opacity:1;} 60%{transform:scale(1.3);opacity:0.7;} 100%{transform:scale(0.2);opacity:0;} }

  .confetti {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 2px;
    pointer-events: none;
    animation: confetti-burst 0.55s ease-out forwards;
  }
  @keyframes confetti-burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

  footer {
    margin-top: 20px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-weight: 600;
    max-width: 320px;
    z-index: 1;
  }

  .overlay {
    position: absolute;
    inset: 8px;
    background: rgba(255,255,255,0.9);
    border-radius: 14px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
    text-align: center;
    padding: 10px;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-family: 'Fredoka', sans-serif; font-size: 1.4rem; margin: 0; color: var(--board); }
  .overlay p { margin: 0; color: var(--ink-soft); font-weight: 600; font-size: 0.85rem; }
  .overlay button {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    padding: 9px 18px;
    background: var(--board);
    color: white;
    box-shadow: 0 4px 0 var(--board-dark);
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<header>
  <h1>Bonbon-Match</h1>
  <p class="subtitle">Tippe zwei benachbarte Bonbons an, um sie zu tauschen 🍭</p>
</header>

<div class="hud">
  <div class="stat">
    <div class="label">Punkte</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="stat">
    <div class="label">Züge</div>
    <div class="value" id="moves">20</div>
  </div>
  <div class="stat">
    <div class="label">Rekord</div>
    <div class="value" id="best">0</div>
  </div>
</div>

<button id="newgame">Neues Spiel</button>

<div class="board-wrap">
  <div id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles-layer" id="tilesLayer"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlayText">Runde vorbei!</h2>
      <p id="overlaySub">Deine Punktzahl: 0</p>
      <button id="overlayBtn">Nochmal spielen</button>
    </div>
  </div>
</div>

<footer>Bringe 3 oder mehr gleiche Bonbons in eine Reihe oder Spalte. Du hast eine begrenzte Anzahl Züge – hol das Maximum raus!</footer>

<script>
(function(){
  const SIZE = 8;
  const CANDIES = [
    {emoji:'🍬', bg:'#FFD3E8'},
    {emoji:'🍭', bg:'#FFC9B0'},
    {emoji:'🍩', bg:'#FFE29A'},
    {emoji:'🧁', bg:'#D4F5A9'},
    {emoji:'🍫', bg:'#B7B4FF'},
    {emoji:'🍡', bg:'#A9E4F5'}
  ];
  const START_MOVES = 20;

  let grid, score, best, movesLeft, cellPx, gapPx, selected, busy;
  const boardEl = document.getElementById('board');
  const gridBg = document.getElementById('gridBg');
  const tilesLayer = document.getElementById('tilesLayer');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlaySub = document.getElementById('overlaySub');

  best = parseInt(localStorage.getItem('bonbon-match-best') || '0', 10);
  bestEl.textContent = best;

  for (let i=0; i<SIZE*SIZE; i++){
    const c = document.createElement('div');
    c.className = 'cell-bg';
    gridBg.appendChild(c);
  }

  function measure(){
    gapPx = 5;
    const rect = tilesLayer.getBoundingClientRect();
    cellPx = (rect.width - gapPx*(SIZE-1)) / SIZE;
  }

  function randType(excludeMatchAt){
    return Math.floor(Math.random()*CANDIES.length);
  }

  function newGame(){
    measure();
    score = 0;
    movesLeft = START_MOVES;
    selected = null;
    busy = false;
    overlay.classList.remove('show');
    scoreEl.textContent = 0;
    movesEl.textContent = movesLeft;

    grid = [];
    for (let r=0; r<SIZE; r++){
      const row = [];
      for (let c=0; c<SIZE; c++){
        let t;
        do {
          t = randType();
        } while (
          (c>=2 && row[c-1]===t && row[c-2]===t) ||
          (r>=2 && grid[r-1] && grid[r-1][c]===t && grid[r-2] && grid[r-2][c]===t)
        );
        row.push(t);
      }
      grid.push(row);
    }
    renderAll();
  }

  function tileId(r,c){ return `t_${r}_${c}`; }

  function renderAll(){
    tilesLayer.innerHTML = '';
    for (let r=0; r<SIZE; r++){
      for (let c=0; c<SIZE; c++){
        createTileEl(r,c,grid[r][c],true);
      }
    }
  }

  function createTileEl(r,c,type,spawnAnim){
    const el = document.createElement('div');
    el.className = 'tile' + (spawnAnim ? ' spawn' : '');
    el.dataset.r = r;
    el.dataset.c = c;
    el.id = tileId(r,c);
    const candy = CANDIES[type];
    el.style.background = candy.bg;
    el.textContent = candy.emoji;
    positionTile(el, r, c);
    el.addEventListener('click', () => onTileClick(r,c));
    tilesLayer.appendChild(el);
    return el;
  }

  function positionTile(el, r, c){
    el.style.width = cellPx + 'px';
    el.style.height = cellPx + 'px';
    el.style.left = c*(cellPx+gapPx) + 'px';
    el.style.top = r*(cellPx+gapPx) + 'px';
  }

  function getTileEl(r,c){ return document.getElementById(tileId(r,c)); }

  function onTileClick(r,c){
    if (busy || movesLeft<=0) return;
    if (!selected){
      selected = {r,c};
      getTileEl(r,c).classList.add('selected');
      return;
    }
    const {r:r0,c:c0} = selected;
    getTileEl(r0,c0).classList.remove('selected');
    if (r0===r && c0===c){ selected=null; return; }

    const adjacent = (Math.abs(r0-r)+Math.abs(c0-c)) === 1;
    if (!adjacent){
      selected = {r,c};
      getTileEl(r,c).classList.add('selected');
      return;
    }
    selected = null;
    attemptSwap(r0,c0,r,c);
  }

  function attemptSwap(r0,c0,r1,c1){
    busy = true;
    swapGrid(r0,c0,r1,c1);
    animateSwap(r0,c0,r1,c1, () => {
      const matches = findMatches();
      if (matches.size === 0){
        // swap back
        swapGrid(r0,c0,r1,c1);
        animateSwap(r1,c1,r0,c0, () => { busy = false; });
      } else {
        movesLeft--;
        movesEl.textContent = movesLeft;
        resolveMatches(matches, () => {
          busy = false;
          if (movesLeft<=0) endGame();
        });
      }
    });
  }

  function swapGrid(r0,c0,r1,c1){
    const tmp = grid[r0][c0];
    grid[r0][c0] = grid[r1][c1];
    grid[r1][c1] = tmp;
  }

  function animateSwap(r0,c0,r1,c1, cb){
    const elA = getTileEl(r0,c0);
    const elB = getTileEl(r1,c1);
    // swap ids/dataset to match new grid positions, then move visually
    elA.id = tileId(r1,c1);
    elA.dataset.r = r1; elA.dataset.c = c1;
    elB.id = tileId(r0,c0);
    elB.dataset.r = r0; elB.dataset.c = c0;
    positionTile(elA, r1, c1);
    positionTile(elB, r0, c0);
    elA.onclick = () => onTileClick(r1,c1);
    elB.onclick = () => onTileClick(r0,c0);
    setTimeout(cb, 170);
  }

  function findMatches(){
    const matched = new Set();
    for (let r=0; r<SIZE; r++){
      let runStart = 0;
      for (let c=1; c<=SIZE; c++){
        if (c<SIZE && grid[r][c]===grid[r][runStart] && grid[r][c]!==-1){
          continue;
        }
        if (c - runStart >= 3){
          for (let k=runStart;k<c;k++) matched.add(r+'_'+k);
        }
        runStart = c;
      }
    }
    for (let c=0; c<SIZE; c++){
      let runStart = 0;
      for (let r=1; r<=SIZE; r++){
        if (r<SIZE && grid[r][c]===grid[runStart][c] && grid[r][c]!==-1){
          continue;
        }
        if (r - runStart >= 3){
          for (let k=runStart;k<r;k++) matched.add(k+'_'+c);
        }
        runStart = r;
      }
    }
    return matched;
  }

  function resolveMatches(matches, done){
    // clear animation
    let gained = matches.size * 10;
    matches.forEach(key => {
      const [r,c] = key.split('_').map(Number);
      const el = getTileEl(r,c);
      if (el) el.classList.add('clearing');
      grid[r][c] = -1;
    });
    burstConfetti();
    score += gained;
    scoreEl.textContent = score;
    if (score > best){
      best = score;
      localStorage.setItem('bonbon-match-best', best);
      bestEl.textContent = best;
    }

    setTimeout(() => {
      matches.forEach(key => {
        const [r,c] = key.split('_').map(Number);
        const el = getTileEl(r,c);
        if (el) el.remove();
      });
      collapseAndRefill(() => {
        const next = findMatches();
        if (next.size > 0){
          setTimeout(() => resolveMatches(next, done), 120);
        } else {
          done();
        }
      });
    }, 220);
  }

  function collapseAndRefill(cb){
    for (let c=0; c<SIZE; c++){
      let writeRow = SIZE-1;
      for (let r=SIZE-1; r>=0; r--){
        if (grid[r][c] !== -1){
          if (writeRow !== r){
            grid[writeRow][c] = grid[r][c];
            grid[r][c] = -1;
            const el = getTileEl(r,c);
            if (el){
              el.id = tileId(writeRow,c);
              el.dataset.r = writeRow;
              el.onclick = () => onTileClick(writeRow,c);
              positionTile(el, writeRow, c);
            }
          }
          writeRow--;
        }
      }
      for (let r=writeRow; r>=0; r--){
        const t = randType();
        grid[r][c] = t;
        const el = createTileEl(r,c,t,false);
        positionTile(el, -1 - (writeRow-r), c);
        requestAnimationFrame(() => {
          el.classList.add('spawn');
          positionTile(el, r, c);
        });
      }
    }
    setTimeout(cb, 200);
  }

  function burstConfetti(){
    const rect = boardEl.getBoundingClientRect();
    const colors = ['#FF6FA5','#FFC24B','#38C6C0','#7C5CFF','#A9F5D0'];
    for (let i=0; i<8; i++){
      const p = document.createElement('div');
      p.className = 'confetti';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.left = (rect.width/2) + 'px';
      p.style.top = (rect.height/2) + 'px';
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*40;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
      p.style.setProperty('--rot', (Math.random()*360)+'deg');
      boardEl.appendChild(p);
      setTimeout(() => p.remove(), 600);
    }
  }

  function endGame(){
    overlayText.textContent = 'Runde vorbei! 🍬';
    overlaySub.textContent = `Deine Punktzahl: ${score}`;
    overlay.classList.add('show');
  }

  document.getElementById('overlayBtn').addEventListener('click', newGame);
  document.getElementById('newgame').addEventListener('click', newGame);
  window.addEventListener('resize', () => { measure(); renderAll(); });

  newGame();
})();
</script>
</body>
</html>
